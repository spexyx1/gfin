<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate PWA Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: white;
    }
    canvas {
      display: none;
    }
    .icon-preview {
      display: inline-block;
      margin: 10px;
      text-align: center;
    }
    .icon-preview img {
      border: 2px solid #333;
      display: block;
      margin-bottom: 5px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      background: linear-gradient(to right, #FFFF00, #FF8C00);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 20px 0;
    }
    button:hover {
      opacity: 0.9;
    }
    #previews {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>Click the button to generate all PWA icon sizes from the G logo</p>
  <button onclick="generateAllIcons()">Generate All Icons</button>
  <div id="previews"></div>

  <svg id="source-logo" style="display: none;" width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff00ff"/>
        <stop offset="33%" style="stop-color:#00ffff"/>
        <stop offset="66%" style="stop-color:#ffff00"/>
        <stop offset="100%" style="stop-color:#ff00ff"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="100" height="100" fill="#000000" rx="15"/>
    <text x="50" y="75" font-size="80" font-weight="900" font-family="Impact, Arial Black, sans-serif" text-anchor="middle" fill="url(#g1)" filter="url(#glow)" style="paint-order:stroke;stroke:#000;stroke-width:3px">G</text>
  </svg>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

    function generateAllIcons() {
      const previewsDiv = document.getElementById('previews');
      previewsDiv.innerHTML = '<h2>Generated Icons:</h2>';

      sizes.forEach(size => {
        generateIcon(size, previewsDiv);
      });
    }

    function generateIcon(size, container) {
      const svg = document.getElementById('source-logo');
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const svgData = new XMLSerializer().serializeToString(svg);
      const img = new Image();

      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);

        const preview = document.createElement('div');
        preview.className = 'icon-preview';

        const previewImg = document.createElement('img');
        previewImg.src = canvas.toDataURL('image/png');
        previewImg.width = Math.min(size, 128);
        previewImg.height = Math.min(size, 128);

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `icon-${size}x${size}.png`;
        link.textContent = `Download ${size}x${size}`;
        link.style.display = 'block';
        link.style.color = '#FFFF00';

        preview.appendChild(previewImg);
        preview.appendChild(link);
        container.appendChild(preview);
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
