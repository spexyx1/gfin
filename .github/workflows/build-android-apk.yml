name: Build Android APK

on:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, e.g. 1)'
        required: true
        default: '1'

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.0
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://nnlwgwlvdrvwbmzeugfe.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ubHdnd2x2ZHJ2d2JtemV1Z2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkwODI2MjgsImV4cCI6MjA3NDY1ODYyOH0.7IMMcK-tLMgYWnAZFK6oxXXeTOoRb_3OJl269ySU5uI' }}
          VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID || 'b9b4eef80d3ef333b26790780966d938' }}
          VITE_NETWORK_ENV: mainnet
          VITE_CHAIN_ID: '137'
          VITE_GHETTO_TOKEN_ADDRESS: '0x3176b45b7295Bdac9cFeF845aEde3C40ed2d0DE3'
          VITE_ESCROW_CONTRACT_ADDRESS: '0xC05B7db1C24027BC062088F8F10C38836e660392'
          VITE_USDC_ADDRESS: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch deprecated lintOptions in generated Gradle files
        run: |
          sed -i 's/lintOptions/lint/g' android/capacitor-cordova-android-plugins/build.gradle || true
          sed -i 's/lintOptions/lint/g' android/app/capacitor.build.gradle || true

      - name: Set version
        working-directory: android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.event.inputs.version_code || 1 }}/g" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name || '1.0.0' }}\"/g" app/build.gradle

      - name: Generate signing keystore
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Verify Gradle installation
        run: gradle --version

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
            ghetto-finance-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghetto-finance-apk
          path: ghetto-finance-*.apk
          retention-days: 90

      - name: Publish APK to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://nnlwgwlvdrvwbmzeugfe.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_KEY is not configured; keeping the APK as a GitHub artifact."
            exit 0
          fi

          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          FILE_SIZE=$(stat -c%s "ghetto-finance-${VERSION}.apk" 2>/dev/null || stat -f%z "ghetto-finance-${VERSION}.apk")
          FILE_SIZE_MB=$((FILE_SIZE / 1048576))

          echo "Uploading APK to Supabase Storage (upsert)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/app-releases/ghetto-finance-${VERSION}.apk?upsert=true" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@ghetto-finance-${VERSION}.apk")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Storage upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/ghetto-finance-${VERSION}.apk"

          echo "Marking previous Android releases as not latest..."
          curl -s -o /dev/null -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_releases?platform=eq.android" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"is_latest": false}'

          echo "Upserting release record in database..."
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/app_releases" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation,resolution=merge-duplicates" \
            -d "{
              \"platform\": \"android\",
              \"version\": \"${VERSION}\",
              \"download_url\": \"${DOWNLOAD_URL}\",
              \"changelog\": \"GHETTO FINANCE mobile app v${VERSION}. Full marketplace, messaging, wallet, social feed, and order tracking.\",
              \"file_size_mb\": ${FILE_SIZE_MB},
              \"min_os_version\": \"7.0\",
              \"is_latest\": true
            }")

          if [ "$DB_STATUS" != "201" ] && [ "$DB_STATUS" != "200" ]; then
            echo "Database upsert failed with HTTP $DB_STATUS"
            exit 1
          fi

          echo "APK published at: ${DOWNLOAD_URL}"
