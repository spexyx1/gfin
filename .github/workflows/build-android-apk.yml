name: Build Android APK

on:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, e.g. 1)'
        required: true
        default: '1'

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version
        working-directory: android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.event.inputs.version_code || 1 }}/g" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name || '1.0.0' }}\"/g" app/build.gradle

      - name: Generate debug keystore
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
            ghetto-finance-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghetto-finance-apk
          path: ghetto-finance-*.apk
          retention-days: 90

      - name: Upload to Supabase Storage (optional)
        if: ${{ vars.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          FILE_SIZE=$(stat -c%s "ghetto-finance-${VERSION}.apk" 2>/dev/null || stat -f%z "ghetto-finance-${VERSION}.apk")
          FILE_SIZE_MB=$((FILE_SIZE / 1048576))

          curl -s -X POST \
            "${SUPABASE_URL}/storage/v1/object/app-releases/ghetto-finance-${VERSION}.apk" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@ghetto-finance-${VERSION}.apk"

          DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/ghetto-finance-${VERSION}.apk"

          curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/app_releases" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{
              \"platform\": \"android\",
              \"version\": \"${VERSION}\",
              \"download_url\": \"${DOWNLOAD_URL}\",
              \"changelog\": \"GHETTO FINANCE mobile app v${VERSION}. Full marketplace, messaging, wallet, social feed, and order tracking.\",
              \"file_size_mb\": ${FILE_SIZE_MB},
              \"min_os_version\": \"7.0\",
              \"is_latest\": true
            }"

          echo "APK published at: ${DOWNLOAD_URL}"
